name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fetch Spotify-colored stats.svg
        run: |
          mkdir -p dist
          # Generated in CI, then hosted on stats-output — README never hits vercel rate limits.
          curl -fsSL -o dist/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&hide_rank=false&cache_seconds=1800&title_color=1DB954&icon_color=1DB954&text_color=B3B3B3&bg_color=121212&ring_color=1DB954"

      - name: Push stats.svg to stats-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

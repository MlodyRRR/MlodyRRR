name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Build Spotify-styled stats.svg via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p dist

          api() {
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          USER_JSON=$(api "https://api.github.com/users/${USERNAME}")
          REPOS_JSON=$(api "https://api.github.com/users/${USERNAME}/repos?per_page=100&type=owner")
          EVENTS_JSON=$(api "https://api.github.com/users/${USERNAME}/events/public?per_page=100")

          PUBLIC_REPOS=$(echo "$USER_JSON" | jq -r '.public_repos // 0')
          FOLLOWERS=$(echo "$USER_JSON" | jq -r '.followers // 0')
          FOLLOWING=$(echo "$USER_JSON" | jq -r '.following // 0')
          STARS=$(echo "$REPOS_JSON" | jq '[.[].stargazers_count] | add // 0')
          FORKS=$(echo "$REPOS_JSON" | jq '[.[].forks_count] | add // 0')
          COMMITS=$(echo "$EVENTS_JSON" | jq '[.[] | select(.type=="PushEvent") | (.payload.size // (.payload.commits|length) // 0)] | add // 0')

          cat > dist/stats.svg <<EOF
          <svg width="420" height="165" viewBox="0 0 420 165" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${USERNAME} GitHub stats">
            <title>@${USERNAME} GitHub stats</title>
            <rect width="420" height="165" rx="12" fill="#121212"/>
            <rect x="0" y="0" width="6" height="165" fill="#1DB954"/>
            <text x="24" y="36" fill="#1DB954" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="16" font-weight="700">${USERNAME}'s GitHub Stats</text>
            <g font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13" font-weight="600">
              <text x="24" y="70" fill="#1DB954">★</text>
              <text x="46" y="70" fill="#B3B3B3">Total Stars:</text>
              <text x="190" y="70" fill="#FFFFFF">${STARS}</text>

              <text x="24" y="96" fill="#1DB954">📦</text>
              <text x="46" y="96" fill="#B3B3B3">Public Repos:</text>
              <text x="190" y="96" fill="#FFFFFF">${PUBLIC_REPOS}</text>

              <text x="24" y="122" fill="#1DB954">⑂</text>
              <text x="46" y="122" fill="#B3B3B3">Forks:</text>
              <text x="190" y="122" fill="#FFFFFF">${FORKS}</text>

              <text x="24" y="148" fill="#1DB954">☺</text>
              <text x="46" y="148" fill="#B3B3B3">Followers:</text>
              <text x="190" y="148" fill="#FFFFFF">${FOLLOWERS}</text>

              <text x="250" y="70" fill="#B3B3B3">Following:</text>
              <text x="360" y="70" fill="#FFFFFF">${FOLLOWING}</text>

              <text x="250" y="96" fill="#B3B3B3">Recent pushes:</text>
              <text x="360" y="96" fill="#FFFFFF">${COMMITS}</text>
            </g>
          </svg>
          EOF

          sed -i 's/^          //' dist/stats.svg
          ls -la dist/stats.svg

      - name: Push stats.svg to stats-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
